name: fleet-lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  fleet-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans every commit of the PR
          persist-credentials: false
      - uses: kleinbem/actions/nix-setup@8d97c5a48bf3966994d5747c07f096938b8ecea5 # v1.8.0
      - uses: kleinbem/actions/lint@8d97c5a48bf3966994d5747c07f096938b8ecea5 # v1.8.0
