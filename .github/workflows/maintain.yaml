name: Maintain Flake
on:
  workflow_dispatch:
  schedule:
    # 02:45 UTC, after the sub-flakes.
    - cron: '45 2 * * *'

# Nightly flake.lock PR, shared: kleinbem/actions' maintain-flake.
permissions: {}

jobs:
  maintain:
    uses: kleinbem/actions/.github/workflows/maintain-flake.yaml@8d97c5a48bf3966994d5747c07f096938b8ecea5 # v1.8.0
    secrets:
      app-id: ${{ secrets.APP_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
