[package]
name = "nix-revue"
version = "0.1.0"
edition = "2021"
authors = ["Martin <martin@kleinbem.dev>"]
description = "Nix-native, forge-agnostic AI code review engine with subscription fallback (Claude, Gemini, Ollama)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kleinbem-dev/nix-revue"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.7", features = ["json"] }
patch = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
glob = "0.3"
async-trait = "0.1"
hmac = "0.13.0"
sha2 = "0.11.1"
hex = "0.4.3"
